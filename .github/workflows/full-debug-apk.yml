name: Build Full Debug APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "iperfIntegration/**"
      - "shizukuIntegration/**"
      - "playIntegration/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/full-debug-apk.yml"

jobs:
  build-full-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "cmake;4.1.2" \
            "ndk;30.0.16248370"

      - name: Build Full Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 \
            :app:assembleFullDebug --stacktrace 2>&1 | tee /tmp/assemble-full-debug.log

      - name: Upload Full Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: trafficlight-full-debug-${{ github.sha }}
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Unit test root spike protocol
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 \
            :app:testFullDebugUnitTest \
            --tests "com.leekleak.trafficlight.spike.*" \
            --stacktrace 2>&1 | tee /tmp/spike-unit-test.log

      - name: Diagnose unit test failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ ! -f /tmp/spike-unit-test.log ]; then
            echo "::error::unit test log missing"
            exit 0
          fi
          {
            echo "### Unit test failure diagnostics"
            echo '```text'
            grep -n -E "FAILURE:|BUILD FAILED|What went wrong|Execution failed for task|Could not (resolve|find)|error:|e: |Caused by:|Task .* not found|No tests found" \
              /tmp/spike-unit-test.log | head -40
            echo '```'
          } | tee /tmp/diag.txt
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAILURE:|BUILD FAILED|What went wrong|Execution failed for task|Could not (resolve|find)|Task .* not found|No tests found" \
            /tmp/spike-unit-test.log | head -8 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Prove Play and Lite do not carry libsu
        shell: bash
        run: |
          set -euo pipefail
          for flavor in play lite; do
            echo "Checking ${flavor}DebugRuntimeClasspath for libsu"
            ./gradlew --no-daemon --max-workers=2 \
              :app:dependencies --configuration "${flavor}DebugRuntimeClasspath" \
              > "/tmp/${flavor}-deps.txt"
            if grep -qi "libsu\|topjohnwu" "/tmp/${flavor}-deps.txt"; then
              echo "::error::${flavor} flavor resolves libsu/topjohnwu"
              grep -i "libsu\|topjohnwu" "/tmp/${flavor}-deps.txt"
              exit 1
            fi
            echo "${flavor}: no libsu dependency"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
