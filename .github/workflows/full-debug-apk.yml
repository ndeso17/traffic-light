name: Build Full Debug APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "iperfIntegration/**"
      - "shizukuIntegration/**"
      - "playIntegration/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/full-debug-apk.yml"

jobs:
  build-full-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "cmake;4.1.2" \
            "ndk;30.0.16248370"

      - name: Build Full Debug APK
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 \
            :app:assembleFullDebug --stacktrace 2>&1 | tee /tmp/assemble-full-debug.log

      - name: Upload Full Debug APK
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: trafficlight-full-debug-${{ github.sha }}
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Unit test root spike protocol
        id: spike_unit_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=2 \
            :app:testFullDebugUnitTest \
            --tests "com.leekleak.trafficlight.spike.*" \
            --stacktrace 2>&1 | tee /tmp/spike-unit-test.log

      - name: Prove Play and Lite do not carry libsu
        id: flavor_isolation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            for flavor in play lite; do
              echo "Checking ${flavor}DebugRuntimeClasspath for libsu"
              ./gradlew --no-daemon --max-workers=2 \
                :app:dependencies --configuration "${flavor}DebugRuntimeClasspath" \
                > "/tmp/${flavor}-deps.txt"
              if grep -qi "libsu\|topjohnwu" "/tmp/${flavor}-deps.txt"; then
                echo "${flavor} flavor resolves libsu/topjohnwu"
                grep -i "libsu\|topjohnwu" "/tmp/${flavor}-deps.txt"
                exit 1
              fi
              echo "${flavor}: no libsu dependency"
            done
          } 2>&1 | tee /tmp/flavor-isolation.log

      - name: Verify libsu reaches only the Full Debug variant
        id: libsu_scope
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            ./gradlew --no-daemon --max-workers=2 \
              :app:dependencies --configuration fullDebugRuntimeClasspath \
              > /tmp/full-debug-deps.txt
            echo "fullDebug runtime classpath libsu entries:"
            grep -i "libsu\|topjohnwu" /tmp/full-debug-deps.txt || true
            if ! grep -qi "libsu\|topjohnwu" /tmp/full-debug-deps.txt; then
              echo "fullDebug variant does not resolve libsu"
              exit 1
            fi
          } 2>&1 | tee /tmp/libsu-scope.log

      - name: Verify spike harness is packaged
        id: harness_packaged
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            apk=$(ls app/build/outputs/apk/full/debug/*.apk | head -1)
            echo "APK: $apk"
            unzip -p "$apk" 'classes*.dex' > /tmp/full-debug-classes.dex
            for symbol in \
              "Lcom/leekleak/trafficlight/spike/RootSpikeActivity;" \
              "Lcom/leekleak/trafficlight/spike/RootSpikeProtocol;" \
              "Lcom/leekleak/trafficlight/spike/RootSpikeShellRunner;" \
              "Lcom/topjohnwu/superuser/Shell;"; do
              if ! strings /tmp/full-debug-classes.dex | grep -qF "$symbol"; then
                echo "symbol missing from dex: $symbol"
                exit 1
              fi
              echo "dex contains: $symbol"
            done
            aapt2=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 | tail -1)
            "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml > /tmp/full-debug-manifest.txt
            if ! grep -q "RootSpikeActivity" /tmp/full-debug-manifest.txt; then
              echo "manifest does not declare RootSpikeActivity"
              exit 1
            fi
            if ! grep -q "android.intent.category.LAUNCHER" /tmp/full-debug-manifest.txt; then
              echo "manifest has no launcher activity"
              exit 1
            fi
            echo "manifest declares RootSpikeActivity with a launcher intent filter"
          } 2>&1 | tee /tmp/harness-packaged.log

      - name: Diagnose failures
        if: always() && (steps.assemble.outcome != 'success' || steps.spike_unit_test.outcome != 'success' || steps.flavor_isolation.outcome != 'success' || steps.libsu_scope.outcome != 'success' || steps.harness_packaged.outcome != 'success')
        shell: bash
        run: |
          set +e
          for log in /tmp/assemble-full-debug.log /tmp/spike-unit-test.log /tmp/flavor-isolation.log /tmp/libsu-scope.log /tmp/harness-packaged.log; do
            if [ ! -f "$log" ]; then
              echo "::warning::missing log $log"
              continue
            fi
            block=$(awk '/FAILURE: Build failed/{flag=1} flag' "$log" | head -30)
            if [ -z "$block" ]; then
              block=$(tail -30 "$log")
            fi
            {
              echo "### $(basename "$log")"
              echo '```text'
              printf '%s\n' "$block"
              echo '```'
            } | tee -a /tmp/diagnostics.txt
            escaped=$(printf '%s' "$block" | head -25 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$log")::${escaped}"
          done
          if [ -f /tmp/diagnostics.txt ]; then
            cat /tmp/diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce build and test results
        if: always()
        shell: bash
        run: |
          echo "assemble outcome: ${{ steps.assemble.outcome }}"
          echo "unit test outcome: ${{ steps.spike_unit_test.outcome }}"
          echo "flavor isolation outcome: ${{ steps.flavor_isolation.outcome }}"
          echo "libsu scope outcome: ${{ steps.libsu_scope.outcome }}"
          echo "harness packaging outcome: ${{ steps.harness_packaged.outcome }}"
          failed=0
          if [ "${{ steps.assemble.outcome }}" != "success" ]; then
            echo "::error::Full Debug APK build did not succeed"
            failed=1
          fi
          if [ "${{ steps.spike_unit_test.outcome }}" != "success" ]; then
            echo "::error::root spike unit test did not succeed"
            failed=1
          fi
          if [ "${{ steps.flavor_isolation.outcome }}" != "success" ]; then
            echo "::error::Play/Lite flavor isolation check did not succeed"
            failed=1
          fi
          if [ "${{ steps.libsu_scope.outcome }}" != "success" ]; then
            echo "::error::libsu is not scoped to the Full Debug variant"
            failed=1
          fi
          if [ "${{ steps.harness_packaged.outcome }}" != "success" ]; then
            echo "::error::root spike harness is not packaged in the APK"
            failed=1
          fi
          exit "$failed"
