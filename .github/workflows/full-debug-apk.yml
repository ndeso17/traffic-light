name: Build Full Debug APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "iperfIntegration/**"
      - "shizukuIntegration/**"
      - "playIntegration/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/full-debug-apk.yml"

jobs:
  build-full-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "cmake;4.1.2" \
            "ndk;30.0.16248370"

      - name: Build Full Debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleFullDebug --stacktrace

      - name: Upload Full Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: trafficlight-full-debug-${{ github.sha }}
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
